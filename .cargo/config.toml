# cargo configuration for the skein workspace.

[env]
# relative path (from the workspace root, since that's where `cargo build`
# is expected to be invoked from) to a real, migrated sqlite dev db, used by
# sqlx's `query!`/`query_as!` macros for compile-time query checking ("online"
# mode) against reliquary's schema.
#
# this file is a local build artifact, not checked in (see .gitignore) -
# reproduce it with:
#   cargo run -p reliquary -- --data-dir reliquary/dev-data friend list
# (any subcommand that calls `reliquary::db::open()` works - this one is
# side-effect-free). that runs reliquary's migrations
# (`reliquary/migrationz/`) against a fresh sqlite file, which is all the
# macros need to validate queries against.
#
# offline mode (`cargo sqlx prepare` + a committed `.sqlx/` cache) isn't
# needed here - there's no docker/CI build of reliquary today that would
# lack a `DATABASE_URL` connection at compile time.
DATABASE_URL = "sqlite:reliquary/dev-data/skein-hub.db"
