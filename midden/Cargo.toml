[package]
name = "midden"
version = "0.1.14"
edition = "2021"
description = "WASM bindings for the skein P2P canvas (iroh-based)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bao-tree = { version = "0.16", default-features = false, features = [
    "experimental-mixed",
    "tokio_fsm",
    "validate",
    "serde",
] }
blake3 = "1.5"
bytes = "1.10"
indexmap = "2"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
# local fork checkout (branch e-opfs-store) — see
# docs/opfs-store-implementation-plan.md. version 0.103.0 + the opfs store work.
iroh-blobs = { path = "../../../n0-computer/iroh-blobs", default-features = false }
js-sys = "0.3"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# io-util: AsyncReadExt for the chunked BlobReader loop in
# download_verified_streaming. sync: mpsc/oneshot channels backing
# ImportSession's chunked add_stream import. both wasm-safe (no runtime).
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-subscriber-wasm = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-nontrapping-float-to-int", "--enable-bulk-memory"]
