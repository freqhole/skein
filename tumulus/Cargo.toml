[package]
name = "tumulus"
version = "0.1.10"
edition.workspace = true
description = "headless hub peer for skein canvas P2P ecosystem"

[lib]
name = "tumulus"
path = "src/lib.rs"

[[bin]]
name = "tumulus"
path = "src/main.rs"

[dependencies]
freqhole-reliquary = { package = "reliquary", git = "https://github.com/freqhole/tomb", tag = "v0.2.13", features = [
    "thumbnails",
] }
haruspex = { git = "https://github.com/freqhole/tomb", tag = "v0.2.13", features = ["iroh"] }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
automerge = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
getrandom = "0.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
webp = { version = "0.3", default-features = false, features = ["img"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
# unifies with the [dependencies] haruspex entry above for test/bench builds
# only, adding haruspex::testing (open_in_memory + per-store constructors)
# without pulling it into the production lib build.
haruspex = { git = "https://github.com/freqhole/tomb", tag = "v0.2.13", features = [
    "iroh",
    "test-utils",
] }
