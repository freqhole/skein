[package]
name = "skein"
version = "0.1.12"
edition = "2021"
description = "skein desktop shell"

[lib]
name = "skein_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "skein"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [
    "macos-private-api",
    "devtools",
    "protocol-asset",
] }
# pinned exactly alongside tauri (not otherwise used directly) so tao stays on
# 0.34.8 -- tauri-runtime-wry 2.11.x pulls in tao 0.35.x, which regressed
# ndk-context init on android and crashes real devices (see charnel's own
# lockfile, still on this same combo, for the known-good reference point).
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
n0-future = "0.3"
base64 = "0.22"
blake3 = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
# re-zips an exploded epub directory (some editing tools leave mimetype/
# META-INF/OPS loose on disk instead of a real zip archive) back into a
# proper epub — see epub_repair.rs. same version charnel already uses.
zip = { version = "2", default-features = false, features = ["deflate"] }

tumulus = { path = "../tumulus" }
freqhole-reliquary = { package = "reliquary", git = "https://github.com/freqhole/tomb", tag = "v0.3.1" }

# android only: wry's android WebViewClient.handleRequest (and skein's own
# reqwest clients) build a rustls-backed client, which panics ("no provider
# set") if no default CryptoProvider is installed. we install ring at app
# startup. desktop targets keep using their existing tls stacks unchanged.
[target."cfg(target_os = \"android\")".dependencies]
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# test-utils pulls in reliquary::testing (make_local_storage_node etc.) — only
# activated for test builds, resolver v2 keeps it out of the release binary.
freqhole-reliquary = { package = "reliquary", git = "https://github.com/freqhole/tomb", tag = "v0.3.1", features = [
    "test-utils",
] }
tempfile = "3"
