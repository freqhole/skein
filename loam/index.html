<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>skein</title>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("/fonts/space-mono.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Caveat";
        src: url("/fonts/caveat.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Permanent Marker";
        src: url("/fonts/permanent-marker.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Silkscreen";
        src: url("/fonts/silkscreen.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Playfair Display";
        src: url("/fonts/playfair-display.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        src: url("/fonts/atkinson-hyperlegible-next.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas-root {
        width: 100vw;
        height: 100vh;
        /* the only place the top system-bar inset (android edge-to-edge)
           is accounted for - pixi's resizeTo plugin reads this element's
           (border-box) client size, so the whole stage shifts down and
           shrinks accordingly and no widget needs its own safe-area logic. */
        padding-top: env(safe-area-inset-top, 0px);
        touch-action: none;
        position: relative;
      }
      /* shown immediately at first paint (pure css, no js needed) while
         the midden p2p node/worker + first canvas doc load - removed by
         src/canvas/init.ts once the real pixi canvas is actually mounted.
         see docs/... boot-spinner note in init.ts for the removal site. */
      #boot-spinner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #666678;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #boot-spinner .spinner-ring {
        width: 32px;
        height: 32px;
        border: 3px solid #2a2a3e;
        border-top-color: #d946ef;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-error {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #ef4444;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        padding: 20px;
        text-align: center;
      }
      noscript {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #888;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-root">
      <div id="boot-spinner">
        <div class="spinner-ring"></div>
        <div>loading skein…</div>
      </div>
    </div>
    <noscript>skein requires javascript to run.</noscript>
    <script type="module" src="/src/standalone/boot.ts"></script>
  </body>
</html>
