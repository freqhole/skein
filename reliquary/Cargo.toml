[package]
name = "reliquary"
# pinned independently of the workspace version (rather than
# `version.workspace = true`) so it never collides with the freqhole/reliquary
# path dependency below, which is also named "reliquary" at version 0.1.0 in
# its own repo - cargo refuses to resolve two different-source packages that
# share both name and version in one lockfile.
version = "0.1.1"
edition.workspace = true
description = "headless hub peer for skein canvas P2P ecosystem"

[lib]
name = "reliquary"
path = "src/lib.rs"

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
freqhole-reliquary = { package = "reliquary", path = "../../reliquary/rust" }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
automerge = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
indexmap = { workspace = true }
async-trait = { workspace = true }
getrandom = "0.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
webp = { version = "0.3", default-features = false, features = ["img"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
